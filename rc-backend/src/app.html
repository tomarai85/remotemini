<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.png">
<title>rc — Claude Code を電話から</title>
<style>
  /* 依存ゼロ。外部フォント・CDN を読まない(機内・地下鉄で開くので) */
  :root {
    --bg: #0b0d10; --panel: #14181d; --line: #232a32; --fg: #e7ecf2; --dim: #93a1b1;
    --ok: #5ec26a; --warn: #e0b83c; --bad: #e5645a; --link: #6aa8ff;
    --tap: 44px; /* 指で押せる最小 */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    /* iOS のホーム画面追加時、下端のバーに隠れない */
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
    overscroll-behavior-y: none;
  }
  .screen { display: none; height: 100vh; height: 100dvh; flex-direction: column; }
  .screen.on { display: flex; }
  header {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    border-bottom: 1px solid var(--line); background: var(--panel);
    position: sticky; top: 0; z-index: 2;
  }
  header h1 { font-size: 16px; margin: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button {
    font: inherit; color: var(--fg); background: #1d242c; border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 14px; min-height: var(--tap); cursor: pointer;
  }
  button:active { background: #262f39; }
  button.primary { background: #2b5fa8; border-color: #3a72c4; }
  button.ghost { background: transparent; }
  button[disabled] { opacity: .5; }
  .body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 0 12px; }
  .pad { padding: 14px; }
  input[type=password], input[type=text], textarea {
    width: 100%; font: inherit; color: var(--fg); background: #0f1317;
    border: 1px solid var(--line); border-radius: 10px; padding: 12px;
  }
  textarea { resize: none; max-height: 40dvh; }

  /* 一覧 */
  .row { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line);
         border-radius: 0; background: transparent; padding: 12px 14px; }
  .row .t { font-weight: 600; }
  .row .s { color: var(--dim); font-size: 14px; margin-top: 2px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .row .m { color: var(--dim); font-size: 12px; margin-top: 6px; display: flex; gap: 8px; flex-wrap: wrap; }
  .tag { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
  .tag.tmux { color: var(--ok); border-color: #2c4a32; }
  .tag.worker { color: var(--link); border-color: #24384f; }
  .tag.blocked { color: var(--warn); border-color: #4a3f22; }
  .tag.choice { color: var(--bad); border-color: #5a2f2b; font-weight: 600; }
  .tag.unknown { color: var(--dim); }
  .cwd { font-variant: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60%; }

  /* 会話 */
  .band { padding: 6px 14px; font-size: 13px; color: var(--dim); background: #10151a;
          border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
  .band .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
  .band.live .dot { background: var(--ok); }
  .band.off .dot { background: var(--bad); }
  .entry { padding: 8px 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .entry.user { color: var(--fg); }
  .entry.user .who { color: var(--link); }
  .entry.assistant { color: var(--fg); }
  .entry.assistant .who { color: var(--ok); }
  .entry.tool { color: var(--dim); font-size: 14px; }
  .who { font-size: 12px; display: block; margin-bottom: 2px; }
  .composer { border-top: 1px solid var(--line); background: var(--panel);
              padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); display: flex; gap: 8px; align-items: flex-end; }
  .composer textarea { flex: 1; }
  .notice { margin: 8px 14px; padding: 10px 12px; border-radius: 10px; font-size: 14px;
            border: 1px solid var(--line); background: #12171c; }
  .notice.ok { border-color: #2c4a32; }
  .notice.warn { border-color: #4a3f22; }
  .notice.refused { border-color: #4a2c28; }
  .notice.error { border-color: #4a2c28; }
  .muted { color: var(--dim); }
  .center { text-align: center; padding: 30px 14px; color: var(--dim); }
</style>
</head>
<body>

<!-- 1枚目: 鍵 -->
<section id="s-key" class="screen">
  <header><h1>rc</h1></header>
  <div class="body pad">
    <p class="muted">この電話からバックエンドに繋ぐ鍵を貼ってください。鍵はこの端末の中だけに保存されます(送信時は Authorization ヘッダ)。</p>
    <p><input id="key-input" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="RC_TOKEN"></p>
    <p id="key-msg" class="muted"></p>
    <p><button id="key-save" class="primary">つなぐ</button></p>
  </div>
</section>

<!-- 2枚目: 一覧 -->
<section id="s-list" class="screen">
  <header>
    <h1>会話</h1>
    <button id="list-reload" class="ghost">更新</button>
    <button id="key-forget" class="ghost">鍵を忘れる</button>
  </header>
  <div id="list-body" class="body"></div>
</section>

<!-- 3枚目: 会話 -->
<section id="s-conv" class="screen">
  <header>
    <button id="conv-back" class="ghost">←</button>
    <h1 id="conv-title">会話</h1>
  </header>
  <div id="conv-band" class="band"><span class="dot"></span><span id="conv-band-text">つないでいます…</span></div>
  <div id="conv-body" class="body"></div>
  <div id="conv-notice"></div>
  <div class="composer">
    <textarea id="conv-input" rows="1" placeholder="打ち込む" autocapitalize="sentences"></textarea>
    <button id="conv-send" class="primary">送る</button>
    <button id="conv-stop">止める</button>
  </div>
</section>

<script type="module">
import { backoffMs, createSseParser, decodeEvent } from "/frames.mjs";
// ★判断は view.mjs 側にしか置かない。ここに書いた条件は単体検査にも変異検査にも
//   掴めない = 間違っても緑のままになる(2026-08-02 に5箇所まとめて出した)。
import {
  gapNotice, interruptResult, mergeHistory, nextAttempt, nextHistoryLimit,
  relTime, routeLabel, scanLine, sendResult, subtitleOf, whoOf,
} from "/view.mjs";

const $ = (id) => document.getElementById(id);
const KEY_STORE = "rc.key";

// ---- 状態 -------------------------------------------------------------------
// 会話は同時に1つだけ開く。開き直したら前の購読は必ず止める(=世代番号で無効化)。
let key = localStorage.getItem(KEY_STORE) || "";
let gen = 0;                 // 会話を開くたびに増える。古い購読の到着を捨てる為
let conv = null;             // {id, title, history, live, truncated, lastEventId, abort, wake}

// ---- 通信 -------------------------------------------------------------------
function headers(extra) {
  return { authorization: `Bearer ${key}`, ...(extra || {}) };
}

async function api(path, opts) {
  const r = await fetch(path, { ...opts, headers: headers(opts && opts.headers) });
  if (r.status === 401) {
    toKey("鍵が通りませんでした。貼り直してください。");
    throw new Error("unauthorized");
  }
  return r;
}

// ---- 画面切り替え -----------------------------------------------------------
function show(which) {
  for (const s of ["s-key", "s-list", "s-conv"]) $(s).classList.toggle("on", s === which);
}

function toKey(msg) {
  closeConv();
  $("key-msg").textContent = msg || "";
  $("key-input").value = "";
  show("s-key");
}

// ---- 一覧 -------------------------------------------------------------------
async function loadList() {
  const body = $("list-body");
  body.replaceChildren(el("div", "center", "読み込んでいます…"));
  let data;
  try {
    const r = await api("/api/sessions");
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    data = await r.json();
    // ★形が違う 200 を「0件」にしない(2026-08-02)。`|| []` は「取れなかった」を
    //   「会話がありません。」という**断定**へ化けさせる。無いのと読めないのは別。
    if (!Array.isArray(data.sessions)) throw new Error("一覧の形が読めません");
  } catch (e) {
    if (String(e.message) === "unauthorized") return;
    body.replaceChildren(el("div", "center", `一覧を取れませんでした(${e.message})`));
    return;
  }
  const now = Date.now();
  const rows = data.sessions.map((s) => sessionRow(s, now));
  body.replaceChildren(
    ...(rows.length ? rows : [el("div", "center", "会話がありません。")]),
    // ★何本見て何本開いたかをそのまま出す。速さを主張する側が計器を持つ(§2.12)。
    el("div", "center muted", scanLine(data.scan)),
  );
}

function sessionRow(s, now) {
  const label = routeLabel(s.live);
  const b = el("button", "row");
  b.append(
    el("div", "t", s.title || s.id),
    el("div", "s", subtitleOf(s)),
    (() => {
      const m = el("div", "m");
      m.append(
        el("span", `tag ${label.kind}`, label.short || label.text),
        el("span", "cwd", s.cwd || ""),
        el("span", "", relTime(s.updatedAt, now)),
      );
      return m;
    })(),
  );
  b.addEventListener("click", () => openConv(s));
  return b;
}

// ---- 会話 -------------------------------------------------------------------
function closeConv() {
  gen++;
  if (conv) {
    if (conv.abort) conv.abort.abort();
    if (conv.wake) conv.wake();
  }
  conv = null;
}

async function openConv(s) {
  closeConv();
  const myGen = ++gen;
  conv = {
    id: s.id, title: s.title || s.id, gen: myGen,
    history: [], live: [], historyLoaded: false, truncated: false,
    lastEventId: "", abort: null, wake: null,
    // ★一覧が知っている経路状態。`screen` 事象が来るまで、そして**来ない会話では最後まで**
    //   これが帯の中身になる(ペインの無い会話は購読がワーカー経路に落ちて screen が来ない)。
    state: s.live || null,
  };
  $("conv-title").textContent = conv.title;
  $("conv-body").replaceChildren(el("div", "center", "読み込んでいます…"));
  $("conv-notice").replaceChildren();
  band("", stateText(conv.state, "つないでいます…"));
  show("s-conv");
  // ★購読を**先に**開く。履歴を先に撮ると、その隙間に書かれた発言がどちらにも入らない。
  //   先に開けば同じ隙間は「重なる」に変わり、mergeHistory が剥がせる(view.mjs)。
  streamLoop(myGen);
  loadHistory(myGen);
}

async function loadHistory(myGen, limit) {
  if (!conv || conv.gen !== myGen) return; // 閉じた後に届いた gap で落とさない
  try {
    const r = await api(`/api/sessions/${encodeURIComponent(conv.id)}/history?limit=${limit || 50}`);
    if (!conv || conv.gen !== myGen) return;
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    if (!conv || conv.gen !== myGen) return;
    // ★loadList と同じ理由。形が違う 200 を空の履歴として飲まない(2026-08-02)。
    if (!Array.isArray(d.history)) throw new Error("履歴の形が読めません");
    conv.history = d.history;
    conv.truncated = !!d.truncated;
    conv.historyLoaded = true;
    renderConv();
  } catch (e) {
    if (String(e.message) === "unauthorized") return;
    if (conv && conv.gen === myGen) {
      notice("error", `履歴を取れませんでした(${e.message})`);
      // ★描き直す。「以前を読む」は押した時に自分を disabled にするので、失敗したまま
      //   描き直さないと**二度と押せない**(renderConv がボタンを毎回作り直す設計に依存)。
      renderConv();
    }
  }
}

function renderConv() {
  const body = $("conv-body");
  const stick = nearBottom(body);
  const all = conv.historyLoaded ? mergeHistory(conv.history, conv.live) : conv.live;
  const nodes = [];
  if (conv.historyLoaded && conv.truncated) {
    const more = el("button", "row muted", "以前を読む");
    more.addEventListener("click", () => {
      more.disabled = true;
      loadHistory(conv.gen, nextHistoryLimit(conv.history.length));
    });
    nodes.push(more);
  }
  for (const e of all) {
    const d = el("div", `entry ${e.role}`);
    d.append(el("span", "who", whoOf(e.role)), document.createTextNode(e.text || ""));
    nodes.push(d);
  }
  if (!nodes.length) nodes.push(el("div", "center", "まだ発言がありません。"));
  body.replaceChildren(...nodes);
  if (stick) body.scrollTop = body.scrollHeight;
}

const nearBottom = (n) => n.scrollHeight - n.scrollTop - n.clientHeight < 80;

/**
 * 帯に出す文。★出所は `routeLabel` ただ1つ = 一覧の札と会話の帯が食い違わない。
 * 状態を知らない時だけ `fallback`(接続の様子)に落ちる。
 */
function stateText(v, fallback) {
  if (!v) return fallback;
  const l = routeLabel(v);
  return l.screen ? `${l.text}(${l.screen})` : l.text;
}

function band(kind, text) {
  const b = $("conv-band");
  b.className = `band ${kind}`;
  $("conv-band-text").textContent = text;
}

function notice(kind, text) {
  $("conv-notice").replaceChildren(el("div", `notice ${kind}`, text));
}

// ---- 流れ(SSE を自前で読む。EventSource はヘッダを打てない。DESIGN §2.13) ----
async function streamLoop(myGen) {
  let attempt = 0;
  while (conv && conv.gen === myGen) {
    const ac = new AbortController();
    conv.abort = ac;
    conv.refresh = false; // ★前面復帰による意図的な張り直しか(下の onForeground が立てる)
    conv.reading = false; // ★今この瞬間、開いた流れを読んでいるか
    let openedAt = 0;
    try {
      const r = await fetch(`/api/sessions/${encodeURIComponent(conv.id)}/stream`, {
        headers: headers(conv.lastEventId ? { "last-event-id": conv.lastEventId } : undefined),
        signal: ac.signal,
      });
      if (r.status === 401) return toKey("鍵が通りませんでした。貼り直してください。");
      if (!r.ok || !r.body) throw new Error(`HTTP ${r.status}`);
      openedAt = Date.now();
      band("live", stateText(conv && conv.gen === myGen ? conv.state : null, "つながっています"));
      conv.reading = true;
      const parser = createSseParser();
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        if (!conv || conv.gen !== myGen) return;
        for (const ev of parser.push(dec.decode(value, { stream: true }))) onEvent(ev, myGen);
      }
    } catch (e) {
      if (ac.signal.aborted) {
        // 自分で閉じた。ただし**前面復帰による張り直し**だけは続行する。
        // ★根拠は iOS の内部挙動ではない(それは私が観測していない)。背面に居た後、
        //   この流れが生きている証拠を私は何も持っていないのに、帯は「つながっています」と
        //   断定し続ける。証拠の無い断定こそこの系が禁じているもの。張り直せば証拠が出る。
        if (!conv || conv.gen !== myGen || !conv.refresh) return;
        conv.refresh = false;
        band("off", "前面に戻ったのでつなぎ直しています。");
        continue; // ★待たずに張り直す(backoff は「切れた」時のもので、これは切れていない)
      }
    }
    if (!conv || conv.gen !== myGen) return;
    attempt = nextAttempt(attempt, openedAt, Date.now()); // ★判定は view.mjs
    const ms = backoffMs(attempt);
    band("off", `切れました。${Math.round(ms / 1000)}秒後につなぎ直します。`);
    await sleepOrWake(ms, myGen);
  }
}

// 待ちの間に前面へ戻ったら**待たずに**試す(ロック解除の直後に見たい)。
function sleepOrWake(ms, myGen) {
  return new Promise((resolve) => {
    let done = false;
    const fin = () => {
      if (done) return;
      done = true;
      clearTimeout(t);
      document.removeEventListener("visibilitychange", onVis);
      if (conv && conv.gen === myGen) conv.wake = null;
      resolve();
    };
    const onVis = () => { if (document.visibilityState === "visible") fin(); };
    const t = setTimeout(fin, ms);
    document.addEventListener("visibilitychange", onVis);
    if (conv && conv.gen === myGen) conv.wake = fin;
  });
}

function onEvent(ev, myGen) {
  const d = decodeEvent(ev);
  if (d.id) conv.lastEventId = d.id;
  if (!d.ok) { notice("warn", "読めない通知が来ました(表示は続きます)。"); return; }
  if (d.type === "screen") {
    conv.state = d.body; // 以後の再接続でも同じ状態を出せる(帯が接続の話に戻らない)
    band("live", stateText(conv.state, ""));
    return;
  }
  if (d.type === "gap") {
    const g = gapNotice(d.body && d.body.why); // ★出す/出さないの判定は view.mjs
    if (g) notice("warn", g);
    conv.live = [];
    loadHistory(myGen);
    return;
  }
  if (d.type === "message") {
    const add = (d.body && d.body.entries) || [];
    if (!add.length) return;
    conv.live.push(...add);
    renderConv();
  }
}

// ---- 送る / 止める ----------------------------------------------------------
async function send() {
  const ta = $("conv-input");
  const text = ta.value.trim();
  if (!text || !conv) return;
  const btn = $("conv-send");
  btn.disabled = true;
  try {
    const r = await api(`/api/sessions/${encodeURIComponent(conv.id)}/messages`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ text }),
    });
    // ★読めなかった時に空の本文を捏造しない(2026-08-02)。`{}` は「読めたが鍵が無い」と
    //   区別が付かず、判定層がそれを「確認できた」側へ倒していた。`null` = 読めなかった。
    const body = await r.json().catch(() => null);
    const v = sendResult(r.status, body);
    notice(v.kind, v.text);
    if (!v.keepText) ta.value = ""; // ★判定は view.mjs。ここに条件を書かない
  } catch (e) {
    if (String(e.message) !== "unauthorized") notice("error", `送れませんでした(${e.message})`);
  } finally {
    btn.disabled = false;
  }
}

async function interrupt() {
  if (!conv) return;
  try {
    const r = await api(`/api/sessions/${encodeURIComponent(conv.id)}/interrupt`, { method: "POST" });
    const body = await r.json().catch(() => null); // ★send() と同じ。読めない事を値にしない
    const v = interruptResult(r.status, body); // ★判定は view.mjs。send() と同じ形
    notice(v.kind, v.text);
  } catch (e) {
    if (String(e.message) !== "unauthorized") notice("error", `止められませんでした(${e.message})`);
  }
}

// ---- 部品 -------------------------------------------------------------------
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text; // ★本文は必ず textContent(innerHTML を使わない)
  return n;
}

// ---- 配線 -------------------------------------------------------------------
$("key-save").addEventListener("click", () => {
  const v = $("key-input").value.trim();
  if (!v) return;
  key = v;
  localStorage.setItem(KEY_STORE, v);
  show("s-list");
  loadList();
});
$("key-forget").addEventListener("click", () => {
  localStorage.removeItem(KEY_STORE);
  key = "";
  toKey("鍵を消しました。");
});
$("list-reload").addEventListener("click", loadList);
$("conv-back").addEventListener("click", () => { closeConv(); show("s-list"); loadList(); });
$("conv-send").addEventListener("click", send);
$("conv-stop").addEventListener("click", interrupt);
$("conv-input").addEventListener("input", (e) => {
  $("conv-notice").replaceChildren(); // 前の送信結果を残したまま次を打たせない
  e.target.style.height = "auto";
  e.target.style.height = `${Math.min(e.target.scrollHeight, window.innerHeight * 0.4)}px`;
});

// ★前面へ戻った時、読んでいる最中の流れを一度畳んで張り直す(2026-08-02)。
//   sleepOrWake の listener は「切れて待っている間」だけの話で、**開いたまま黙った**
//   流れには誰も触っていなかった。帯が「つながっています」と出したままになるのは、
//   観測していない事を断定する事に等しい。張り直せば、その断定に証拠が付く。
function onForeground() {
  if (document.visibilityState !== "visible") return;
  if (!conv || !conv.reading) return;              // 待ち中は sleepOrWake の担当
  if (!conv.abort || conv.abort.signal.aborted) return;
  conv.refresh = true;                              // ★catch 側にこれが意図的だと伝える
  conv.abort.abort();
}
document.addEventListener("visibilitychange", onForeground);

if (key) { show("s-list"); loadList(); } else { show("s-key"); }
</script>
</body>
</html>
