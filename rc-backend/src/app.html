<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.png">
<title>rc — Claude Code を電話から</title>
<style>
  /* 依存ゼロ。外部フォント・CDN を読まない(機内・地下鉄で開くので) */
  :root {
    --bg: #0b0d10; --panel: #14181d; --line: #232a32; --fg: #e7ecf2; --dim: #93a1b1;
    --ok: #5ec26a; --warn: #e0b83c; --bad: #e5645a; --link: #6aa8ff;
    --tap: 44px; /* 指で押せる最小 */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    overscroll-behavior-y: none;
  }
  /* ★安全域の余白は body ではなく **`.screen` の側**に置く(2026-08-03、DESIGN §2.19 U2)。
     body に置くと、`box-sizing:border-box` なので余白は `height:100%` の**内側**に入る。
     ところが子の `.screen` は `100dvh` = 画面まるごと。差の `inset-top` ぶんだけ下へはみ出し、
     一番下に置いた `.composer`(`送る`/`止める`)がそのぶん画面の外へ出る。
     `.screen` 側へ移せば同じ border-box の内側に収まるので積み上がらない。
     効くのは `env(safe-area-inset-top)` が 0 でない時 = **ホーム画面に追加した時**と横向き。
     `apple-mobile-web-app-capable` も manifest も入れてある = standalone は想定内の使い方。 */
  .screen {
    display: none;
    height: 100vh;
    height: var(--vvh, 100dvh); /* ★鍵盤が出たら実高さへ差し替わる(§2.19 U3)。JS が px を流す */
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }
  .screen.on { display: flex; }
  /* 会話画面の下端は `.composer` が自分で安全域を持つ。一覧と鍵の画面は `.body` が
     最後の子なので、ホームバーに潜らない様にこちらで下の安全域を足す。 */
  .screen > .body:last-child { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
  header {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    border-bottom: 1px solid var(--line); background: var(--panel);
    position: sticky; top: 0; z-index: 2;
  }
  header h1 { font-size: 16px; margin: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button {
    font: inherit; color: var(--fg); background: #1d242c; border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 14px; min-height: var(--tap); cursor: pointer;
  }
  button:active { background: #262f39; }
  button.primary { background: #2b5fa8; border-color: #3a72c4; }
  button.ghost { background: transparent; }
  button[disabled] { opacity: .5; }
  .body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 0 12px; }
  .pad { padding: 14px; }
  input[type=password], input[type=text], textarea {
    width: 100%; font: inherit; color: var(--fg); background: #0f1317;
    border: 1px solid var(--line); border-radius: 10px; padding: 12px;
  }
  /* ★上限も **今見えている高さ**の4割(2026-08-03、§2.19 U4)。`40dvh` は鍵盤が出ても
     縮まないので、JS 側だけ直しても CSS の上限が古い物差しのまま残る。両方が `--vvh` を見る。 */
  textarea { resize: none; max-height: calc(var(--vvh, 100dvh) * 0.4); }

  /* 一覧 */
  .row { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line);
         border-radius: 0; background: transparent; padding: 12px 14px; }
  .row .t { font-weight: 600; }
  .row .s { color: var(--dim); font-size: 14px; margin-top: 2px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .row .m { color: var(--dim); font-size: 12px; margin-top: 6px; display: flex; gap: 8px; flex-wrap: wrap; }
  .tag { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
  .tag.tmux { color: var(--ok); border-color: #2c4a32; }
  .tag.worker { color: var(--link); border-color: #24384f; }
  .tag.blocked { color: var(--warn); border-color: #4a3f22; }
  .tag.choice { color: var(--bad); border-color: #5a2f2b; font-weight: 600; }
  .tag.unknown { color: var(--dim); }
  .cwd { font-variant: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60%; }

  /* 会話 */
  .band { padding: 6px 14px; font-size: 13px; color: var(--dim); background: #10151a;
          border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
  .band .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
  .band.live .dot { background: var(--ok); }
  .band.off .dot { background: var(--bad); }
  .entry { padding: 8px 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .entry.user { color: var(--fg); }
  .entry.user .who { color: var(--link); }
  .entry.assistant { color: var(--fg); }
  .entry.assistant .who { color: var(--ok); }
  .entry.tool { color: var(--dim); font-size: 14px; }
  .who { font-size: 12px; display: block; margin-bottom: 2px; }
  .composer { border-top: 1px solid var(--line); background: var(--panel);
              padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); display: flex; gap: 8px; align-items: flex-end; }
  .composer textarea { flex: 1; }
  .notice { margin: 8px 14px; padding: 10px 12px; border-radius: 10px; font-size: 14px;
            border: 1px solid var(--line); background: #12171c; }
  .notice.ok { border-color: #2c4a32; }
  .notice.warn { border-color: #4a3f22; }
  .notice.refused { border-color: #4a2c28; }
  .notice.error { border-color: #4a2c28; }
  /* 選択待ちの操作面。composer の真上に置く = 「今この会話に必要な操作」が親指の届く所に並ぶ */
  #conv-choice:empty { display: none; }
  #conv-choice { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 10px 2px; }
  .choice-head { font-size: 13px; color: var(--dim); padding: 0 4px 8px; white-space: pre-wrap; }
  /* 縦に積む。横並びだと選択肢の本文(「Opus 5 …」)が省略され、**押す物の名前が読めなくなる** */
  .choice-keys { display: flex; flex-direction: column; gap: 8px; padding-bottom: 8px; }
  .choice-keys button { text-align: left; }
  /* 送信待ちの面。選択待ちと同じく composer の真上 = 「その送信はまだ届いていない」と、
     取り消す手段が、打ち込む所の隣に在る */
  #conv-queue:empty { display: none; }
  #conv-queue { border-top: 1px solid var(--line); background: var(--panel); padding: 10px; }
  .queue-text { font-size: 13px; color: var(--dim); padding: 0 4px 8px; }
  /* 送信待ちの数も観測値。古くなった事は一覧と同じ作法で言う(色は .muted.stale が付ける) */
  .queue-age { font-size: 12px; padding: 6px 4px 0; }
  .muted { color: var(--dim); }
  /* 古い値である事は**色でも**言う。文だけだと一覧の下端に埋もれる */
  .muted.stale { color: var(--warn); }
  .center { text-align: center; padding: 30px 14px; color: var(--dim); }
</style>
</head>
<body>

<!-- 1枚目: 鍵 -->
<section id="s-key" class="screen">
  <header><h1>rc</h1></header>
  <div class="body pad">
    <p class="muted">この電話からバックエンドに繋ぐ鍵を貼ってください。鍵はこの端末の中だけに保存されます(送信時は Authorization ヘッダ)。</p>
    <p><input id="key-input" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="RC_TOKEN"></p>
    <p id="key-msg" class="muted"></p>
    <p><button id="key-save" class="primary">つなぐ</button></p>
  </div>
</section>

<!-- 2枚目: 一覧 -->
<section id="s-list" class="screen">
  <header>
    <h1>会話</h1>
    <button id="list-reload" class="ghost">更新</button>
    <button id="key-forget" class="ghost">鍵を忘れる</button>
  </header>
  <div id="list-body" class="body"></div>
</section>

<!-- 3枚目: 会話 -->
<section id="s-conv" class="screen">
  <header>
    <button id="conv-back" class="ghost">←</button>
    <h1 id="conv-title">会話</h1>
  </header>
  <div id="conv-band" class="band"><span class="dot"></span><span id="conv-band-text">つないでいます…</span></div>
  <div id="conv-body" class="body"></div>
  <div id="conv-notice"></div>
  <!-- 選択待ちの操作面。中身は renderChoicePanel が毎回作り直す(空 = 選択待ちでない) -->
  <div id="conv-choice"></div>
  <!-- 送信待ちの面。中身は renderQueuePanel が毎回作り直す(空 = 待っていない、または数を知らない) -->
  <div id="conv-queue"></div>
  <div class="composer">
    <textarea id="conv-input" rows="1" placeholder="打ち込む" autocapitalize="sentences"></textarea>
    <button id="conv-send" class="primary">送る</button>
    <button id="conv-stop">止める</button>
  </div>
</section>

<script type="module">
// ★`createSseParser` / `decodeEvent` は**もう読み込まない**(2026-08-04)。電話は SSE を
//   使わなくなったので、置いたままにすると「使っている様に見える死んだ依存」になる。
//   frames.mjs 側には残す — `/stream` と e2e / live-http-check がまだ使う(§2.36)。
import { backoffMs } from "/frames.mjs";
// ★判断は view.mjs 側にしか置かない。ここに書いた条件は単体検査にも変異検査にも
//   掴めない = 間違っても緑のままになる(2026-08-02 に5箇所まとめて出した)。
import {
  choiceResult, choiceView, clearQueueResult, freshness, gapNotice, interruptResult, mergeHistory,
  nextAttempt, nextHistoryLimit, queueView, readablePoll, relTime, routeLabel, scanLine, sendResult,
  subtitleOf, whoOf,
} from "/view.mjs";

const $ = (id) => document.getElementById(id);
const KEY_STORE = "rc.key";

// ---- 状態 -------------------------------------------------------------------
// 会話は同時に1つだけ開く。開き直したら前の購読は必ず止める(=世代番号で無効化)。
let key = localStorage.getItem(KEY_STORE) || "";
let gen = 0;                 // 会話を開くたびに増える。古い購読の到着を捨てる為
let conv = null;             // {id, title, history, live, truncated, abort, wake}

// ---- 通信 -------------------------------------------------------------------
function headers(extra) {
  return { authorization: `Bearer ${key}`, ...(extra || {}) };
}

async function api(path, opts) {
  const r = await fetch(path, { ...opts, headers: headers(opts && opts.headers) });
  if (r.status === 401) {
    toKey("鍵が通りませんでした。貼り直してください。");
    throw new Error("unauthorized");
  }
  return r;
}

// ---- 画面切り替え -----------------------------------------------------------
function show(which) {
  for (const s of ["s-key", "s-list", "s-conv"]) $(s).classList.toggle("on", s === which);
}

function toKey(msg) {
  closeConv();
  $("key-msg").textContent = msg || "";
  $("key-input").value = "";
  show("s-key");
}

// ---- 一覧の古さ -------------------------------------------------------------
// ★一覧は網を叩いた瞬間の観測で、その後は勝手に古くなる(DESIGN §2.19 U1)。
//   放っておくと画面は 20 分前の値を**現在形で**出し続ける = この系が一番よく踏む型。
//   網を叩くのは「前面に戻った時」と「更新」だけ(一覧1回 = 実測 0.75 秒。時計で
//   叩き続けると edith に恒久的な負荷を載せる事になる)。古さは手元の時計で刻む。
let listFetchedAt = 0;   // 一覧が**取れた**時刻(ms)。0 = まだ取れていない
let listAgeNode = null;  // 古さを出す節点。描き直すたびに作り直す
let listClock = null;    // 古さを刻む時計。**網は叩かない**

function paintListAge() {
  if (!listAgeNode || !listAgeNode.isConnected) return;
  const f = freshness(listFetchedAt, Date.now()); // ★判定は view.mjs。ここに条件を書かない
  listAgeNode.textContent = f.text;
  listAgeNode.className = f.stale ? "center muted stale" : "center muted";
}

function startListClock() {
  if (listClock) return;
  listClock = setInterval(paintListAge, 1000);
}

// ---- 一覧 -------------------------------------------------------------------
async function loadList() {
  const body = $("list-body");
  body.replaceChildren(el("div", "center", "読み込んでいます…"));
  let data;
  try {
    const r = await api("/api/sessions");
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    data = await r.json();
    // ★形が違う 200 を「0件」にしない(2026-08-02)。`|| []` は「取れなかった」を
    //   「会話がありません。」という**断定**へ化けさせる。無いのと読めないのは別。
    if (!Array.isArray(data.sessions)) throw new Error("一覧の形が読めません");
  } catch (e) {
    if (String(e.message) === "unauthorized") return;
    body.replaceChildren(el("div", "center", `一覧を取れませんでした(${e.message})`));
    return;
  }
  const now = Date.now();
  // ★取れた時にだけ時刻を進める。失敗した時に進めると、**古い画面が新しい顔をする**。
  listFetchedAt = now;
  const rows = data.sessions.map((s) => sessionRow(s, now));
  listAgeNode = el("div", "center muted", "");
  body.replaceChildren(
    ...(rows.length ? rows : [el("div", "center", "会話がありません。")]),
    // ★何本見て何本開いたかをそのまま出す。速さを主張する側が計器を持つ(§2.12)。
    el("div", "center muted", scanLine(data.scan)),
    listAgeNode,
  );
  paintListAge();
  startListClock();
}

function sessionRow(s, now) {
  const label = routeLabel(s.live);
  const b = el("button", "row");
  b.append(
    el("div", "t", s.title || s.id),
    el("div", "s", subtitleOf(s)),
    (() => {
      const m = el("div", "m");
      m.append(
        el("span", `tag ${label.kind}`, label.short || label.text),
        el("span", "cwd", s.cwd || ""),
        el("span", "", relTime(s.updatedAt, now)),
      );
      return m;
    })(),
  );
  b.addEventListener("click", () => openConv(s));
  return b;
}

// ---- 会話 -------------------------------------------------------------------
function closeConv() {
  gen++;
  if (conv) {
    if (conv.abort) conv.abort.abort();
    if (conv.wake) conv.wake();
  }
  conv = null;
}

async function openConv(s) {
  closeConv();
  const myGen = ++gen;
  conv = {
    id: s.id, title: s.title || s.id, gen: myGen,
    history: [], live: [], historyLoaded: false, truncated: false,
    abort: null, wake: null,
    // ★一覧が知っている経路状態。`screen` 事象が来るまで、そして**来ない会話では最後まで**
    //   これが帯の中身になる(ペインの無い会話は購読がワーカー経路に落ちて screen が来ない)。
    state: s.live || null,
  };
  $("conv-title").textContent = conv.title;
  $("conv-body").replaceChildren(el("div", "center", "読み込んでいます…"));
  $("conv-notice").replaceChildren();
  renderChoicePanel(conv.state); // ★前の会話の操作面を残さない(一覧の `live` は文字列なので普通は空になる)
  // ★同じ理由で送信待ちの面も消す。前の会話の「送信待ち 2 件」を残すと、**別の会話の数**を
  //   この会話の数として見せる事になる。次の poll が来るまで何も知らないのが正しい。
  //   ★取れた時刻も 0 に戻す。残すと、次の会話の最初の数が**前の会話を測った時刻**を名乗る。
  renderQueuePanel(null, 0);
  band("", stateText(conv.state, "つないでいます…"));
  show("s-conv");
  // ★購読を**先に**開く。履歴を先に撮ると、その隙間に書かれた発言がどちらにも入らない。
  //   先に開けば同じ隙間は「重なる」に変わり、mergeHistory が剥がせる(view.mjs)。
  pollLoop(myGen);
  loadHistory(myGen);
}

async function loadHistory(myGen, limit) {
  if (!conv || conv.gen !== myGen) return; // 閉じた後に届いた gap で落とさない
  try {
    const r = await api(`/api/sessions/${encodeURIComponent(conv.id)}/history?limit=${limit || 50}`);
    if (!conv || conv.gen !== myGen) return;
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    if (!conv || conv.gen !== myGen) return;
    // ★loadList と同じ理由。形が違う 200 を空の履歴として飲まない(2026-08-02)。
    if (!Array.isArray(d.history)) throw new Error("履歴の形が読めません");
    conv.history = d.history;
    conv.truncated = !!d.truncated;
    conv.historyLoaded = true;
    renderConv();
  } catch (e) {
    if (String(e.message) === "unauthorized") return;
    if (conv && conv.gen === myGen) {
      notice("error", `履歴を取れませんでした(${e.message})`);
      // ★描き直す。「以前を読む」は押した時に自分を disabled にするので、失敗したまま
      //   描き直さないと**二度と押せない**(renderConv がボタンを毎回作り直す設計に依存)。
      renderConv();
    }
  }
}

function renderConv() {
  const body = $("conv-body");
  const stick = nearBottom(body);
  const all = conv.historyLoaded ? mergeHistory(conv.history, conv.live) : conv.live;
  const nodes = [];
  if (conv.historyLoaded && conv.truncated) {
    const more = el("button", "row muted", "以前を読む");
    more.addEventListener("click", () => {
      more.disabled = true;
      loadHistory(conv.gen, nextHistoryLimit(conv.history.length));
    });
    nodes.push(more);
  }
  for (const e of all) {
    const d = el("div", `entry ${e.role}`);
    d.append(el("span", "who", whoOf(e.role)), document.createTextNode(e.text || ""));
    nodes.push(d);
  }
  if (!nodes.length) nodes.push(el("div", "center", "まだ発言がありません。"));
  body.replaceChildren(...nodes);
  if (stick) body.scrollTop = body.scrollHeight;
}

const nearBottom = (n) => n.scrollHeight - n.scrollTop - n.clientHeight < 80;

/**
 * 帯に出す文。★出所は `routeLabel` ただ1つ = 一覧の札と会話の帯が食い違わない。
 * 状態を知らない時だけ `fallback`(接続の様子)に落ちる。
 */
function stateText(v, fallback) {
  if (!v) return fallback;
  const l = routeLabel(v);
  return l.screen ? `${l.text}(${l.screen})` : l.text;
}

function band(kind, text) {
  const b = $("conv-band");
  b.className = `band ${kind}`;
  $("conv-band-text").textContent = text;
}

function notice(kind, text) {
  $("conv-notice").replaceChildren(el("div", `notice ${kind}`, text));
}

// ---- 流れ(long-poll。DESIGN §2.36)-----------------------------------------
//
// ★逐次配信(SSE)は使わない。iPhone Safari が `fetch` の本文を逐次で渡すか溜め込むかを
//   我々は測れず(§8-4 = 実機が要る人の門)、「溜め込みを検出して落ちる」判定器を書けば
//   その判定器の正しさが**同じ測れない一点**に載る。`mutex.mjs` の見出しの通り、
//   到達しない守りは守っている様に見えるだけで測れない。
//   完了した応答は中継も browser も溜め込めないので、構造で正しい方を採る。
//   サーバの `/stream` は残っているが、**この画面からは1度も呼ばない**(§2.36)。
const POLL_WAIT_MS = 20000; // サーバ側の上限と同じ。これ以上待たせても切断通知が遅れるだけ
const POLL_IDLE_FLOOR_MS = 1000; // 空応答が即返った時だけ挟む底。暴走を構造で止める

async function pollLoop(myGen) {
  let attempt = 0;
  let cursor = "";
  let everOpened = false;
  while (conv && conv.gen === myGen) {
    const ac = new AbortController();
    conv.abort = ac;
    conv.refresh = false; // ★前面復帰による意図的な張り直しか(下の onForeground が立てる)
    conv.reading = true; // 保留中は「見に行っている最中」= onForeground の担当
    const openedAt = Date.now();
    try {
      const q = new URLSearchParams({ cursor, wait: String(POLL_WAIT_MS) });
      const r = await fetch(`/api/sessions/${encodeURIComponent(conv.id)}/poll?${q}`, {
        headers: headers(), signal: ac.signal,
      });
      if (r.status === 401) return toKey("鍵が通りませんでした。貼り直してください。");
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const d = await r.json();
      if (!conv || conv.gen !== myGen) return;
      // ★形が違う 200 を空の配信として飲まない(loadHistory / loadList と同じ規律)。
      //   飲むと「繋がっているのに何も起きない」= いちばん見分けの付かない嘘になる。
      //   ★中身まで検めるのは**適用の前**でなければ意味が無い。途中で投げると
      //     `conv.live` に半分積んだまま栞が進まず、撃ち直しで同じ物をもう一度積む。
      if (!readablePoll(d)) throw new Error("配信の形が読めません");
      conv.reading = false;
      attempt = 0;
      everOpened = true;
      // ---- 適用と栞の前進は**同じ同期ブロック**。間に await を1つも挟まない -----------
      //   挟むと「適用の途中で失敗したのに栞だけ進んだ」が起こり得る = 取りこぼしが
      //   二度と取り戻せない形で消える。順序も**適用が先**にする。
      applyPoll(d, myGen);
      if (typeof d.cursor === "string" && d.cursor) cursor = d.cursor;
      // ------------------------------------------------------------------------------
      if (!conv || conv.gen !== myGen) return;
      band("live", stateText(conv.state, "つながっています"));
      // 何も無い応答が**即**返った時だけ底を挟む。溜まっている時は `items` が埋まるので
      // `empty` が偽 = 底は掛からず、待たずに次を撃つ。
      // ★条件に `!d.more` を入れない。`more` は「積み切れなかった」の意なので `items` が
      //   空の時に真になる道理が無い —— つまり足しても何も変わらないのに、サーバが
      //   壊れて `more:true` + 空を返した瞬間だけ**底が外れて電話が空回りする**。
      //   守りの条件を相手の正しさに載せない(fail-closed)。
      const empty = d.items.length === 0 && !d.screen;
      if (empty && Date.now() - openedAt < POLL_IDLE_FLOOR_MS) {
        await sleepOrWake(POLL_IDLE_FLOOR_MS, myGen);
      }
      continue;
    } catch (e) {
      // ★世代で守る。`conv &&` だけでは足りない —— 会話を開き直すと `closeConv` が
      //   前の保留を畳み、その catch は**新しい conv が入った後**に走る。素で書くと
      //   新しい世代の `reading` を偽にしてしまい、次の前面復帰が
      //   「待ち中(= sleepOrWake の担当)」と読まれて撃ち直されない。
      if (conv && conv.gen === myGen) conv.reading = false;
      if (ac.signal.aborted) {
        // 自分で畳んだ。ただし**前面復帰による撃ち直し**だけは続行する。
        // ★根拠は iOS の内部挙動ではない(それは私が観測していない)。背面に居た後、
        //   この保留が生きている証拠を私は何も持っていないのに、帯は「つながっています」と
        //   断定し続ける。証拠の無い断定こそこの系が禁じているもの。撃ち直せば証拠が出る。
        if (!conv || conv.gen !== myGen || !conv.refresh) return;
        conv.refresh = false;
        band("off", "前面に戻ったのでつなぎ直しています。");
        continue; // 待たずに撃ち直す(backoff は「切れた」時のもので、これは切れていない)
      }
    }
    if (!conv || conv.gen !== myGen) return;
    // ★`openedAt` は撃つ**直前**。20秒保留された後に切れたのは「健康な接続が落ちた」で、
    //   即座に失敗するのは「そもそも届いていない」。nextAttempt はこの2つを分ける(view.mjs)。
    attempt = nextAttempt(attempt, openedAt, Date.now());
    const ms = backoffMs(attempt);
    band("off", everOpened
      ? `切れました。${Math.round(ms / 1000)}秒後につなぎ直します。`
      : `つながりません。${Math.round(ms / 1000)}秒後に試します。`);
    await sleepOrWake(ms, myGen);
  }
}

// 待ちの間に前面へ戻ったら**待たずに**試す(ロック解除の直後に見たい)。
function sleepOrWake(ms, myGen) {
  return new Promise((resolve) => {
    let done = false;
    const fin = () => {
      if (done) return;
      done = true;
      clearTimeout(t);
      document.removeEventListener("visibilitychange", onVis);
      if (conv && conv.gen === myGen) conv.wake = null;
      resolve();
    };
    const onVis = () => { if (document.visibilityState === "visible") fin(); };
    const t = setTimeout(fin, ms);
    document.addEventListener("visibilitychange", onVis);
    if (conv && conv.gen === myGen) conv.wake = fin;
  });
}

/**
 * 1回の poll 応答を画面へ。**同期のみ**(呼び手が栞の前進と同じブロックに置いている)。
 * `loadHistory` は投げっぱなしにする — await すると此処が非同期になり、栞との同期が崩れる。
 */
function applyPoll(d, myGen) {
  let added = false;
  let reread = false;
  for (const it of d.items) {
    if (it.kind === "gap") {
      const g = gapNotice(it.why); // ★出す/出さないの判定は view.mjs
      if (g) notice("warn", g);
      // ★取りこぼしより後に**同じ応答で**届いた本文は捨てない。従来は gap のたびに
      //   `conv.live = []` としていたが、poll は複数の出来事をまとめて運ぶので、
      //   先頭の gap で消して後続を積むと順序は正しいまま残る。
      conv.live = [];
      added = false;
      reread = true;
      continue;
    }
    if (it.kind === "message") {
      // 形は撃つ前に検めてある(view.mjs `readablePoll`)。
      // ★ワーカー経路の item は `entries` を持たず `event`(子の NDJSON 1行)を運ぶ。
      //   その live 描画は**まだ在らず**、SSE の頃から一度も画面に出た事が無い
      //   (旧実装は `entries || []` で黙って捨てていた)。ここで捨てるのは同じ挙動だが、
      //   **捨てていると書いてある**点だけが違う。埋める仕事は §2.36-e に積んだ。
      if (!Array.isArray(it.entries) || it.entries.length === 0) continue;
      conv.live.push(...it.entries);
      added = true;
    }
  }
  // ★毎回描き直す。`d.screen` と違って **poll は毎回この欄を載せる**ので、条件を付けると
  //   「行列が空になった」時に面が消えない。空になった事を見せるのは数を見せるのと同じ仕事。
  // ★時刻は**此処で**取る。応答が届いて適用する瞬間が、この数を観測した瞬間。
  renderQueuePanel(d, Date.now());
  if (d.screen) {
    conv.state = d.screen; // 以後の撃ち直しでも同じ状態を出せる(帯が接続の話に戻らない)
    // ★画面が変わった時にだけ来る(サーバは同じ本文を再送しない)= 操作面を描き直す唯一の口。
    //   押した後に伏せたボタンが戻るのも此処 —— **別の画面になった事**が復帰の条件。
    renderChoicePanel(conv.state);
  }
  if (added || reread) renderConv();
  if (reread) loadHistory(myGen); // 投げっぱなし。此処を await しない事が栞の正しさの条件
}

// ---- 送る / 止める ----------------------------------------------------------
async function send() {
  const ta = $("conv-input");
  const text = ta.value.trim();
  if (!text || !conv) return;
  const btn = $("conv-send");
  btn.disabled = true;
  try {
    const r = await api(`/api/sessions/${encodeURIComponent(conv.id)}/messages`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ text }),
    });
    // ★読めなかった時に空の本文を捏造しない(2026-08-02)。`{}` は「読めたが鍵が無い」と
    //   区別が付かず、判定層がそれを「確認できた」側へ倒していた。`null` = 読めなかった。
    const body = await r.json().catch(() => null);
    const v = sendResult(r.status, body);
    notice(v.kind, v.text);
    if (!v.keepText) ta.value = ""; // ★判定は view.mjs。ここに条件を書かない
  } catch (e) {
    if (String(e.message) !== "unauthorized") notice("error", `送れませんでした(${e.message})`);
  } finally {
    btn.disabled = false;
  }
}

async function interrupt() {
  if (!conv) return;
  try {
    const r = await api(`/api/sessions/${encodeURIComponent(conv.id)}/interrupt`, { method: "POST" });
    const body = await r.json().catch(() => null); // ★send() と同じ。読めない事を値にしない
    const v = interruptResult(r.status, body); // ★判定は view.mjs。send() と同じ形
    notice(v.kind, v.text);
  } catch (e) {
    if (String(e.message) !== "unauthorized") notice("error", `止められませんでした(${e.message})`);
  }
}

// ---- 選択待ちの操作(2026-08-04)---------------------------------------------
//
// 判断は全て `choiceView` (view.mjs)。ここは**節点を並べるだけ**。
//
// ★押した直後に同じ描画のボタンを全部 disabled にする。理由は2つ在って、片方は嘘なので
//   分けて書く:
//   (1) 本当の理由 = 雑音を出さない。二度押しはサーバが `choice-already-sent` で
//       断る(`inject.mjs` `#choiceSent`)ので、押せたままだと**必ず失敗する操作**を
//       人に見せる事になる。
//   (2) Codex (2026-08-04) は「同時押しで2発目が次の画面 = 許可確認へ流れ得るので UI で
//       止めよ」と言った。**その前提はこの実装には当たらない**: `injector.choice` は
//       ペイン鍵(`mutex.run(pane, …)`)で直列化し、鍵の**中**で画面を撮り直して
//       分類・指紋照合してから `tmux.run` する。指紋は打った時点で消費される。
//       Codex には file を読ませていないので、一般論として正しく、この木では既に閉じている。
//       つまりこの disabled は**安全境界ではない** —— 境界はサーバ側に在る。
//       ここで「UI が守っている」と書くと、次に触る人がサーバ側の守りを外しかねない。
//
// ★復帰は「次の描画」でだけ起きる = 画面が実際に変わった時だけ(`applyPoll` の `d.screen`)。
//   押した後に画面が動かない(`unverified`)場合、操作面は伏せたままになる。それが正しい:
//   同じ指紋への二度打ちはサーバが断るので、押せる顔で出す物が無い。
function renderChoicePanel(state) {
  const box = $("conv-choice");
  const v = choiceView(state);
  if (!v.show) { box.replaceChildren(); return; }
  const nodes = [];
  if (v.head.length) nodes.push(el("div", "choice-head", v.head.join("\n")));
  if (v.reason) nodes.push(el("div", "notice refused", v.reason));
  const made = [];
  const keys = el("div", "choice-keys");
  for (const b of v.buttons) {
    const btn = el("button", "", b.label);
    // ★`type` を明示する。今この file に `<form>` は無いので既定の `submit` は発火しないが、
    //   将来 composer が form に包まれた瞬間、入力欄の Enter が**最初のボタン**を撃つ。
    //   打鍵ボタンにそれが起きると、人が触っていない選択が決定される。
    btn.type = "button";
    // ★指紋は**この描画の**値を閉じ込める(`state` を押した時に読み直さない)。
    //   読み直すと、描画と押下の間に届いた poll が別のメニューの指紋を入れ、
    //   古いボタンの表示のまま**見ていない選択**がサーバの照合を通る(Codex 指摘 C)。
    const digest = v.digest;
    btn.addEventListener("click", () => {
      for (const x of made) x.disabled = true; // fetch より**前**に、同期で伏せる
      sendChoice(b.key, digest);
    });
    made.push(btn);
    keys.appendChild(btn);
  }
  if (made.length) nodes.push(keys);
  box.replaceChildren(...nodes);
}

async function sendChoice(key, digest) {
  if (!conv) return;
  try {
    const r = await api(`/api/sessions/${encodeURIComponent(conv.id)}/choice`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ key, digest }),
    });
    const body = await r.json().catch(() => null); // ★send() と同じ。読めない事を値にしない
    const v = choiceResult(r.status, body); // ★判定は view.mjs
    notice(v.kind, v.text);
    // ★指紋の食い違いで自動的に撃ち直さない。サーバの再検証は「その画面が安全か」を
    //   証明するだけで、「人がその画面の選択を意図したか」は証明しない(Codex 指摘 B)。
    //   次の poll が新しい画面を描き、人がもう一度押す。
  } catch (e) {
    if (String(e.message) !== "unauthorized") notice("error", `押せませんでした(${e.message})`);
  }
}

// ---- 送信待ちの取り消し(2026-08-04)-----------------------------------------
//
// 判断は全て `queueView` / `clearQueueResult` (view.mjs)。ここは節点を並べるだけ。
//
// ★数は**サーバが載せた物をそのまま**出す。押した直後に自分で減らさない ——
//   減らすと、取り消しが 409 で断られた時に「0 件」と出たまま実際は積まれている、が起きる。
//   取り消しは `user_dropped` を出す = 保留中の poll が即座に起きて、次の描画で本当の数になる。
//
// ★この面は poll が返った時にしか描き直されない = **返らなくなった時**に「送信待ち 2 件」を
//   現在形で出し続ける(2026-08-04)。数の隣に古さを刻む。一覧(`paintListAge`)と同じ作法で、
//   時計は**網を叩かない** —— 叩くと、切れている相手を1秒毎に殴りに行く事になる。
let queueLast = null;      // 最後に描いた数だけを持つ({queued:N})。poll の本文は抱えない
let queueFetchedAt = 0;    // その数が**取れた**時刻(ms)。0 = まだ取れていない
let queueAgeNode = null;   // 古さを出す節点。面を消す時は null に戻す(下の理由)
let queueClock = null;     // 古さを刻む時計

function renderQueuePanel(d, fetchedAtMs) {
  const box = $("conv-queue");
  queueFetchedAt = fetchedAtMs;
  const v = queueView(d, fetchedAtMs, Date.now());
  if (!v.show) {
    // ★参照も一緒に落とす。此処を忘れると、面を消した後も時計が**外れた節点**を描き続け、
    //   次に面が出た時に古い節点と新しい節点の2つが古さを名乗る。
    queueLast = null;
    queueAgeNode = null;
    box.replaceChildren();
    return;
  }
  queueLast = { queued: v.count };
  const btn = el("button", "", v.clearLabel);
  btn.type = "button"; // ★renderChoicePanel と同じ理由(将来 composer が form に包まれた時の暴発)
  btn.addEventListener("click", () => {
    btn.disabled = true; // fetch より前に、同期で伏せる。二度押しは同じ物を2回捨てに行く
    clearQueue();
  });
  queueAgeNode = el("div", "queue-age muted", "");
  box.replaceChildren(el("div", "queue-text", v.text), btn, queueAgeNode);
  paintQueueAge(); // ★初回も時計と**同じ一本**で描く。二本あると刻んだ瞬間に文面が入れ替わる
  startQueueClock();
}

// ★`paintListAge` と違って `isConnected` を見ない。一覧は取得に失敗した枝が
//   `body.replaceChildren(…)` で節点だけ外して参照を残すので必要だが、`#conv-queue` へ
//   書くのは `renderQueuePanel` だけで、そこは必ず参照を差し替えるか null に戻す。
//   在りもしない道の為の番人を置くと、外しても誰も赤にならない = 測れない行が増える。
function paintQueueAge() {
  if (!queueAgeNode) return;
  const v = queueView(queueLast, queueFetchedAt, Date.now()); // ★判定は view.mjs。条件を書かない
  queueAgeNode.textContent = v.ageText;
  queueAgeNode.className = v.stale ? "queue-age muted stale" : "queue-age muted";
}

function startQueueClock() {
  if (queueClock) return; // 描き直すたびに増やさない(1秒毎の描画が面の数だけ走る)
  queueClock = setInterval(paintQueueAge, 1000);
}

async function clearQueue() {
  if (!conv) return;
  try {
    const r = await api(`/api/sessions/${encodeURIComponent(conv.id)}/queue`, { method: "DELETE" });
    const body = await r.json().catch(() => null); // ★send() と同じ。読めない事を値にしない
    const v = clearQueueResult(r.status, body); // ★判定は view.mjs
    notice(v.kind, v.text);
  } catch (e) {
    if (String(e.message) !== "unauthorized") notice("error", `取り消せませんでした(${e.message})`);
  }
}

// ---- 部品 -------------------------------------------------------------------
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text; // ★本文は必ず textContent(innerHTML を使わない)
  return n;
}

// ---- 配線 -------------------------------------------------------------------
$("key-save").addEventListener("click", () => {
  const v = $("key-input").value.trim();
  if (!v) return;
  key = v;
  localStorage.setItem(KEY_STORE, v);
  show("s-list");
  loadList();
});
$("key-forget").addEventListener("click", () => {
  localStorage.removeItem(KEY_STORE);
  key = "";
  toKey("鍵を消しました。");
});
$("list-reload").addEventListener("click", loadList);
$("conv-back").addEventListener("click", () => { closeConv(); show("s-list"); loadList(); });
$("conv-send").addEventListener("click", send);
$("conv-stop").addEventListener("click", interrupt);
$("conv-input").addEventListener("input", (e) => {
  $("conv-notice").replaceChildren(); // 前の送信結果を残したまま次を打たせない
  e.target.style.height = "auto";
  // ★上限は **今見えている高さ**の4割(2026-08-03、DESIGN §2.19 U4)。
  //   iOS は鍵盤が出ても `window.innerHeight` も `100dvh` も縮まない(縮むのは
  //   `visualViewport.height` だけ)。そこを基準にすると「鍵盤が無い時の画面の4割」を
  //   許す事になり、鍵盤が半分を占めた状態では入力欄が見えている所をほぼ全部食う。
  //   `--vvh` は syncViewportHeight が必ず入れるので、ここは同じ物差しを読むだけにする。
  e.target.style.height = `${Math.min(e.target.scrollHeight, visibleHeight() * 0.4)}px`;
});

// ★前面へ戻った時、読んでいる最中の流れを一度畳んで張り直す(2026-08-02)。
//   sleepOrWake の listener は「切れて待っている間」だけの話で、**開いたまま黙った**
//   流れには誰も触っていなかった。帯が「つながっています」と出したままになるのは、
//   観測していない事を断定する事に等しい。張り直せば、その断定に証拠が付く。
function onForeground() {
  if (document.visibilityState !== "visible") return;
  if (!conv || !conv.reading) return;              // 待ち中は sleepOrWake の担当
  if (!conv.abort || conv.abort.signal.aborted) return;
  conv.refresh = true;                              // ★catch 側にこれが意図的だと伝える
  conv.abort.abort();
}
document.addEventListener("visibilitychange", onForeground);

// ★前面に戻った時、一覧を出しているなら取り直す(§2.19 U1-a)。会話画面が流れを
//   張り直すのと**同じ理屈** — 観測していない事を現在形で出さない。拾った瞬間の1回だけ。
function onForegroundList() {
  if (document.visibilityState !== "visible") return;
  if (!$("s-list").classList.contains("on")) return;
  loadList();
}
document.addEventListener("visibilitychange", onForegroundList);

// ★画面の実高さを CSS へ流す(§2.19 U3)。`100dvh` は iOS で鍵盤に反応しない
//   (縮むのは visualViewport の方)ので、これが無いと鍵盤が出た時に
//   `送る`/`止める` が鍵盤の下に入る。高さが固定された段組なので頁自体も逃げられない。
//   ★値は**必ず入れる**(visualViewport が無ければ innerHeight)。CSS 側の
//   `var(--vvh, 100dvh)` の既定値に頼ると、`dvh` を知らない browser で計算時に
//   宣言ごと無効になり、高さが `auto` へ落ちる。
let lastVvh = 0;
// ★「今どれだけ見えているか」を答える所を **1つだけ**にする(§2.19 U4)。
//   高さを使う側が2箇所(画面の箱・入力欄の上限)在り、片方が `window.innerHeight` を
//   読んでいた = **同じ画面を別の物差しで測っていた**。物差しを関数に閉じ込めて、
//   使う側は必ずここを通す。ここが `visualViewport` を見る唯一の場所。
function visibleHeight() {
  const vv = window.visualViewport;
  return Math.round((vv && vv.height) || window.innerHeight || 0);
}
function syncViewportHeight() {
  const h = visibleHeight();
  if (h <= 0 || h === lastVvh) return; // 同じ値で描き直しを起こさない
  lastVvh = h;
  document.documentElement.style.setProperty("--vvh", `${h}px`);
}
if (window.visualViewport) window.visualViewport.addEventListener("resize", syncViewportHeight);
window.addEventListener("orientationchange", syncViewportHeight);
syncViewportHeight();

if (key) { show("s-list"); loadList(); } else { show("s-key"); }
</script>
</body>
</html>
