name: RemoteMini
options:
  bundleIdPrefix: com.tomarai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Signing is done out-of-band by tools/build.sh against the wildcard
    # provisioning profile. xcodebuild always produces an unsigned .app for
    # iphoneos (the device path).
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_ENTITLEMENTS: ""
    # iphonesimulator is scoped out of the "no signing" rule above (Sprint 1
    # finding, 2026-08-05): a completely unsigned app has no entitlements blob
    # at all, and Keychain calls (KeychainCredentialStoreTests) fail with
    # errSecMissingEntitlement (-34018) because there is nothing to authorize
    # even the app's own default keychain access group. Local ad hoc signing
    # ("-") needs no Apple Developer account and never touches the on-device
    # path -- tools/build.sh passes its own CODE_SIGN_IDENTITY=- flags on the
    # xcodebuild command line for the device build, which win over anything
    # set here.
    CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: "-"
    CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]: YES
    CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: YES

targets:
  RemoteMini:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Remote Mini
        CFBundleShortVersionString: "0.1"
        # ★此処を `"${RC_BUILD_NUM}"` に「直さない」事(2026-08-10)。此の直値は
        # **build.sh を通さずに焼いた印**として意図的に置いてある。番号の刻印は
        # `ios/tools/build.sh` が generate の**後**に PlistBuddy で書き換える ——
        # 下の RCBuildRev と違って CFBundleVersion は OS が検証する枠なので、
        # 変数が無い呼び手(ui-fixture-absence-control.sh / signout-notice-control.sh は
        # 自分で `xcodegen generate` を撃つ)に `${RC_BUILD_NUM}` という literal を
        # 配ると全ての焼き手が壊れる。此の形なら他の呼び手は無傷のまま、
        # build.sh を通さずに焼いた物だけが「番号が合わない」= 渡米前検査の鎖⑧で赤。
        CFBundleVersion: "1"
        # ★どの commit を焼いたか(2026-08-08 / 監査 X2-7)。上の2つは元は直値の定数で、
        # 最初のビルドから一度も変わっていなかった —— 版として画面に出しても何も識別しない。
        # (2026-08-10 に CFBundleVersion だけは build.sh が commit の通算数を刻む様になった。
        #  但しあれは**機械が突き合わせる為の番号**で、汚れた木で焼いた事は名乗れない。)
        # 人が画面で読む実物の名乗りはこの鍵が持つ。`ios/tools/build.sh` が `xcodegen generate` の
        # **前**に `RC_BUILD_REV` を export し、xcodegen がここへ差し込む。
        #
        # ★変数が未定義でも xcodegen は落ちない —— `${RC_BUILD_REV}` という文字列を
        # そのまま Info.plist に書く(実測、xcodegen 2.45.3)。`${VAR:-既定値}` も
        # 解釈されず literal になる。だから「差し込み損ね」は例外ではなく**もっともらしい
        # 文字列**として画面に届く。それを版と読ませない分岐は `BuildInfo.displayRev` に在る。
        RCBuildRev: "${RC_BUILD_REV}"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The backend is reachable only inside the tailnet over HTTPS with a
        # real cert, so no ATS exception is needed. Keep it that way: an
        # exception here would silently permit plaintext to anywhere.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tomarai.remotemini
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES

  RemoteMiniTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: RemoteMini
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RemoteMini.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/RemoteMini"
        # Needed once iphonesimulator signing is turned on above: codesign
        # refuses to sign a target with no Info.plist, and this target never
        # had one (it didn't need one while unsigned).
        GENERATE_INFOPLIST_FILE: YES

  RemoteMiniUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: RemoteMini
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RemoteMini

schemes:
  RemoteMini:
    build:
      targets:
        RemoteMini: all
        RemoteMiniTests: [test]
        RemoteMiniUITests: [test]
    test:
      targets:
        - RemoteMiniTests
        - RemoteMiniUITests
