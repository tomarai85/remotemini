name: RemoteMini
options:
  bundleIdPrefix: com.tomarai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Signing is done out-of-band by tools/build.sh against the wildcard
    # provisioning profile. xcodebuild always produces an unsigned .app for
    # iphoneos (the device path).
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_ENTITLEMENTS: ""
    # iphonesimulator is scoped out of the "no signing" rule above (Sprint 1
    # finding, 2026-08-05): a completely unsigned app has no entitlements blob
    # at all, and Keychain calls (KeychainCredentialStoreTests) fail with
    # errSecMissingEntitlement (-34018) because there is nothing to authorize
    # even the app's own default keychain access group. Local ad hoc signing
    # ("-") needs no Apple Developer account and never touches the on-device
    # path -- tools/build.sh passes its own CODE_SIGN_IDENTITY=- flags on the
    # xcodebuild command line for the device build, which win over anything
    # set here.
    CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: "-"
    CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]: YES
    CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: YES

targets:
  RemoteMini:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Remote Mini
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The backend is reachable only inside the tailnet over HTTPS with a
        # real cert, so no ATS exception is needed. Keep it that way: an
        # exception here would silently permit plaintext to anywhere.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tomarai.remotemini
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES

  RemoteMiniTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: RemoteMini
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RemoteMini.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/RemoteMini"
        # Needed once iphonesimulator signing is turned on above: codesign
        # refuses to sign a target with no Info.plist, and this target never
        # had one (it didn't need one while unsigned).
        GENERATE_INFOPLIST_FILE: YES

  RemoteMiniUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: RemoteMini
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RemoteMini

schemes:
  RemoteMini:
    build:
      targets:
        RemoteMini: all
        RemoteMiniTests: [test]
        RemoteMiniUITests: [test]
    test:
      targets:
        - RemoteMiniTests
        - RemoteMiniUITests
